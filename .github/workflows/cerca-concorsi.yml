name: Cerca concorsi

on:
  schedule:
    - cron: "30 8,11,13 * * *"   # ogni giorno alle 05:30 UTC (7:30 in estate, 6:30 in inverno, ora italiana)
  workflow_dispatch:        # permette di avviarla anche a mano dal sito GitHub

permissions:
  contents: write           # serve per salvare la pagina aggiornata nel repository

jobs:
  cerca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le librerie
        run: pip install -r requirements.txt

      - name: Cerca i concorsi
        run: python concorsi_infanzia.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGINA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Salva i risultati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs dati
          git diff --staged --quiet || (git commit -m "Aggiornamento concorsi" && git push)
